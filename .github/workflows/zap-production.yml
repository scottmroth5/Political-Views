# Weekly OWASP ZAP baseline scan of production: passive only (it looks, it does not attack), Monday
# 04:00 UTC. Findings open or update a GitHub issue. Active scanning happens only against the
# CI-run copy of the app (ci.yml). Skipped until the site exists (DEPLOY_ENABLED).
name: ZAP scan (production, passive)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  baseline:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.PRODUCTION_URL || 'https://views.scottmroth.com' }}
          allow_issue_writing: true
          issue_title: ZAP baseline scan of production
          fail_action: false
