name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: political_views
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: political_views_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U political_views"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://political_views:ci_password@localhost:5432/political_views_test?schema=public
      TEST_DATABASE_URL: postgresql://political_views:ci_password@localhost:5432/political_views_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
