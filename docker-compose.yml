# Local development database only. Not used in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: political_views
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: political_views
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U political_views -d political_views"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
