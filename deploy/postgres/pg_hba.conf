# Postgres client authentication for the production stack.
# TYPE      DATABASE         USER      ADDRESS  METHOD
# The superuser only over the container's local socket (docker exec: backups, restores, init).
local       all              postgres           peer
# Any network connection without TLS is refused.
hostnossl   all              all       all      reject
# The app's own role, TLS only, to its one database.
hostssl     political_views  app       all      scram-sha-256
